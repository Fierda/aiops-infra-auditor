# Manual Operator / Sysadmin / SRE GitLab CI Template
# All jobs use `when: manual` so git pushes never trigger unintended scans or infra changes.

stages:
  - test
  - aiops_gate
  - validate_iac_ansible

variables:
  PYTHONPATH: "auditor/src"
  AIOPS_MODEL_PROFILE: "prod-16gb-coder"

unit_tests:
  stage: test
  image: python:3.12-slim
  when: manual
  script:
    - python -m unittest discover -s tests -p "test_*.py" -v

aiops_manual_pre_deploy_gate:
  stage: aiops_gate
  image: python:3.12-slim
  when: manual
  # Assign to self-hosted <=16GB VRAM GPU runner when using prod-16gb-* models:
  # tags:
  #   - gpu-16gb
  script:
    - python -m aiops_auditor gate --stage all --repo . --profile "${AIOPS_MODEL_PROFILE}" --fail-on HIGH --auto-sync-cve --out-dir reports
  artifacts:
    when: always
    paths:
      - reports/gate-all/audit-report.json
      - reports/gate-all/audit-report.md
      - reports/gate-all/audit-report.sarif

validate_terraform_readonly:
  stage: validate_iac_ansible
  image: hashicorp/terraform:1.9.8
  when: manual
  script:
    - cd infra/terraform && terraform fmt -check -diff -recursive && terraform init -backend=false && terraform validate
    - cd ../terraform-k8s && terraform fmt -check -diff -recursive && terraform init -backend=false && terraform validate

validate_ansible_readonly:
  stage: validate_iac_ansible
  image: python:3.12-slim
  when: manual
  script:
    - pip install --no-cache-dir ansible-core==2.17.7
    - ansible-galaxy collection install -r ansible/requirements.yml
    - cd ansible && ansible-playbook --syntax-check playbooks/site.yml

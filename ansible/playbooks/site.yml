---
- name: Harden all provisioned infrastructure nodes (Debian/Ubuntu & RHEL/Rocky)
  hosts: all
  become: true
  roles:
    - role: security_hardening

- name: Configure NVIDIA Container Toolkit on GPU-enabled auditor hosts
  hosts: aiops_auditors
  become: true
  roles:
    - role: nvidia_runtime

- name: Deploy hardened application workload
  hosts: app_servers
  become: true
  roles:
    - role: app_runtime

- name: Deploy AIOps Security Auditor & Open-Source LLM Runtime
  hosts: aiops_auditors
  become: true
  roles:
    - role: aiops_auditor

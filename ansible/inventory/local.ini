# Local / staging inventory example (production uses inventory/generated.ini from Terraform)
[app_servers]
localhost ansible_connection=local

[aiops_auditors]
localhost ansible_connection=local

[all:vars]
env_name=dev
aiops_model_profile=local-dev
audit_target_dir=/opt/aiops-auditor/targets
audit_reports_dir=/var/log/aiops-auditor/reports
ansible_python_interpreter=/usr/bin/python3


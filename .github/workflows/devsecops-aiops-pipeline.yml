name: Manual AIOps Security Audit & Pre-Deploy Gate (Operator / SRE Trigger)

# Strictly MANUAL trigger only — pushing code NEVER auto-provisions infra or runs changes.
# Intended to be invoked on-demand by Sysadmin, DevOps, IT Ops, or SRE via GitHub Actions UI ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      gate_stage:
        description: "Audit / Pre-Deploy Gate Scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - app
          - iac
          - ansible
      model_profile:
        description: "AIOps Open-Source LLM Profile"
        required: true
        default: "offline-heuristic"
        type: choice
        options:
          - offline-heuristic
          - local-dev
          - prod-16gb-coder
          - prod-16gb-reasoning
          - prod-16gb-vllm
      auto_sync_cve:
        description: "Auto-sync live CVE KB (CISA KEV + OSV.dev) before auditing"
        required: true
        default: true
        type: boolean
      validate_iac_and_ansible:
        description: "Also run Terraform fmt/validate, Kustomize build, and Ansible syntax-check (read-only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # MANUAL GATE: AIOps Security Audit (Read-Only Analysis + Policy Gate)
  # ============================================================================
  manual-aiops-gate:
    name: Manual AIOps Security Gate (${{ inputs.gate_stage }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run auditor unit & regression tests
        env:
          PYTHONPATH: auditor/src
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Manual AIOps Pre-Deploy / Config-Change Gate
        env:
          PYTHONPATH: auditor/src
          GATE_STAGE: ${{ inputs.gate_stage }}
          MODEL_PROFILE: ${{ inputs.model_profile }}
          AUTO_SYNC: ${{ inputs.auto_sync_cve }}
        run: |
          EXTRA_ARGS=""
          if [ "${AUTO_SYNC}" = "true" ]; then
            EXTRA_ARGS="--auto-sync-cve --enable-osv"
          fi
          python -m aiops_auditor gate \
            --stage "${GATE_STAGE}" \
            --repo . \
            --profile "${MODEL_PROFILE}" \
            --fail-on HIGH \
            ${EXTRA_ARGS} \
            --out-dir reports

      - name: Upload SARIF 2.1.0 Audit Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gate-${{ inputs.gate_stage }}/audit-report.sarif
          category: aiops-manual-gate-${{ inputs.gate_stage }}

      - name: Upload Audit Artifacts (Markdown + JSON + SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-gate-${{ inputs.gate_stage }}-reports
          path: reports/

  # ============================================================================
  # OPTIONAL READ-ONLY VALIDATION: Terraform, Kustomize & Ansible Syntax Check
  # (Never runs terraform apply, kubectl apply, or ansible-playbook changes!)
  # ============================================================================
  manual-iac-ansible-validation:
    name: Manual Read-Only IaC & Ansible Syntax Validation
    if: ${{ inputs.validate_iac_and_ansible == true }}
    needs: [manual-aiops-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform (AWS + Platform-Agnostic K8s/NVIDIA) — Read-Only
        run: |
          cd infra/terraform && terraform fmt -check -diff -recursive && terraform init -backend=false && terraform validate
          cd ../terraform-k8s && terraform fmt -check -diff -recursive && terraform init -backend=false && terraform validate

      - name: Validate Kustomize Overlays — Read-Only
        run: |
          kubectl kustomize k8s/overlays/local-k8s > /dev/null
          kubectl kustomize k8s/overlays/onprem-k8s-nvidia > /dev/null
          kubectl kustomize k8s/overlays/cloud-k8s-nvidia > /dev/null

      - name: Validate Ansible Playbooks Syntax — Read-Only
        run: |
          pip install --no-cache-dir ansible-core==2.17.7
          ansible-galaxy collection install -r ansible/requirements.yml
          cd ansible
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/setup_nvidia_gpu.yml
          ansible-playbook --syntax-check playbooks/deploy_app.yml
          ansible-playbook --syntax-check playbooks/deploy_auditor.yml

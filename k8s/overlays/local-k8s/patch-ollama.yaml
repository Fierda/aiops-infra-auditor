apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: aiops-auditor
spec:
  template:
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-auditor-config
  namespace: aiops-auditor
data:
  AIOPS_MODEL_PROFILE: "local-dev"
  AIOPS_ENABLE_OSV_LOOKUP: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-sample-app
  namespace: aiops-auditor
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: aiops-auditor
spec:
  template:
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"


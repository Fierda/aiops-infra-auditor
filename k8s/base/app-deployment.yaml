apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-sample-app
  namespace: aiops-auditor
  labels:
    app.kubernetes.io/name: aiops-sample-app
    app.kubernetes.io/component: workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-sample-app
        app.kubernetes.io/component: workload
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/your-org/aiops-sample-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-sample-app
  namespace: aiops-auditor
  labels:
    app.kubernetes.io/name: aiops-sample-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops-sample-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP


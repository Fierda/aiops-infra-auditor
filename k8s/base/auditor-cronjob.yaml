apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-reports-pvc
  namespace: aiops-auditor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-security-auditor
  namespace: aiops-auditor
  labels:
    app.kubernetes.io/name: aiops-security-auditor
    app.kubernetes.io/component: security-scanner
spec:
  # Nightly at 02:00 UTC; run ad-hoc via:
  # kubectl -n aiops-auditor create job --from=cronjob/aiops-security-auditor manual-audit-1
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aiops-security-auditor
            app.kubernetes.io/component: security-scanner
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            fsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auditor
              image: ghcr.io/your-org/aiops-auditor:1.0.0
              imagePullPolicy: IfNotPresent
              args:
                - "scan"
                - "--target"
                - "/workspace"
                - "--out-dir"
                - "/reports"
                - "--auto-sync-cve"
                - "--no-fail"
              envFrom:
                - configMapRef:
                    name: aiops-auditor-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
                - name: reports
                  mountPath: /reports
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workspace
              emptyDir: {}
            - name: reports
              persistentVolumeClaim:
                claimName: audit-reports-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi

